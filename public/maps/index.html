</style>

<script>
  (function () {
    var STORAGE_KEY = 'maps_unlocked_v1';
    var SECRET      = 'sabina';

    var gate    = document.getElementById('mapsGate');
    var content = document.getElementById('mapsContent');
    var form    = document.getElementById('mapsGateForm');
    var input   = document.getElementById('mapsGateInput');
    var errMsg  = document.getElementById('mapsGateError');

    function unlock() {
      gate.style.display    = 'none';
      content.style.display = 'block';
    }

    
    try {
      if (sessionStorage.getItem(STORAGE_KEY) === 'yes') {
        unlock();
        return;
      }
    } catch (e) {   }

    
    input.addEventListener('input', function () {
      var lower = this.value.toLowerCase();
      if (this.value !== lower) this.value = lower;
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = (input.value || '').toLowerCase().trim();
      if (v === SECRET) {
        try { sessionStorage.setItem(STORAGE_KEY, 'yes'); } catch (e) {}
        errMsg.textContent = '';
        unlock();
      } else {
        errMsg.textContent = 'Incorrect.';
        input.value = '';
        input.focus();
      }
    });

    
    setTimeout(function () { input.focus(); }, 50);
  })();
</script>

    <script>
      (function () {
        var nav     = document.querySelector('.sidebar-nav');
        var overlay = document.getElementById('sidebarOverlay');
        var btn     = document.getElementById('sidebarToggle');

        function open()  { nav.classList.add('sidebar-open');    overlay.classList.add('sidebar-open');    btn.innerHTML = '&#10005;'; }
        function close() { nav.classList.remove('sidebar-open'); overlay.classList.remove('sidebar-open'); btn.innerHTML = '&#9776;'; }
        function toggle() { nav.classList.contains('sidebar-open') ? close() : open(); }

        btn.addEventListener('click', toggle);
        overlay.addEventListener('click', close);

        document.querySelectorAll('.sidebar-post-link').forEach(function (a) {
          a.addEventListener('click', close);
        });
      })();
    </script>
